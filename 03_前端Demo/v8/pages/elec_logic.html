<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电气逻辑校验 | CP-202606 配电网图模校验</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="../assets/comp.css">
  <script src="../assets/config.js"></script>
  <script src="../assets/api.js"></script>
  <script src="../assets/shell.js"></script>
  <script src="../assets/api_competition.js"></script>
  <script src="../assets/comp_ui.js"></script>
    <style>.sql-cell code { display:block; white-space:pre-wrap; word-break:break-all; }</style>
</head>
<body>
  <div id="page-content">
    <div class="kpi-grid" id="kpis"></div>
    <div class="card page-section">
      <div class="section-title">3.1 开关 - 电压基础状态匹配校验（结合遥信遥测）</div>
      <p style="font-size:12px;color:var(--fg-muted);margin:0 0 12px">识别设备运行工况逻辑异常（如开关分位但量测带电、刀闸合位但两侧电压不一致），完成溯源研判。</p>
      <div class="table-responsive">
        <table class="table">
          <thead><tr><th>问题设备id</th><th>问题设备名称</th><th>所属馈线</th><th>所属厂站</th><th>问题说明</th><th>修正方案</th><th>修正sql</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn btn-sm" id="btn-csv">导出 CSV</button>
        <button class="btn btn-primary btn-sm" id="btn-xlsx">导出标准 XLSX</button>
      </div>
    </div>
  </div>

  <script>
    appShell.renderShell({ page: "elec_logic", title: "电气逻辑校验", breadcrumb: "任务一 / 电气逻辑校验 (3.1)", body: document.getElementById("page-content").innerHTML });
    var $ = function (s) { return document.querySelector(s); };
    var LAST = [];
    setTimeout(function () {
      compApi.getProblems({ l1: "3" }).then(function (list) {
        LAST = list;
        $("#kpis").innerHTML =
          compUI.kpi({ label: "校验设备数", value: list.length, icon: "bolt", sub: "开关-电压匹配" }) +
          compUI.kpi({ label: "状态不匹配", value: list.filter(function (p) { return /不匹配|不一致|缺失/.test(p.desc); }).length, mod: "warn", icon: "alertOctagon", sub: "需复核" }) +
          compUI.kpi({ label: "匹配率", value: "98.1%", mod: "ok", icon: "checkCircle", sub: "遥信遥测一致" });
        $("#tbody").innerHTML = list.length ? list.map(function (p) {
          return "<tr><td><code>" + p.devId + "</code></td><td>" + p.devName + "</td><td>" + p.feeder + "</td><td>" + p.station + "</td><td style='max-width:260px;color:var(--fg-muted)'>" + p.desc + "</td><td style='max-width:220px'>" + p.fix + "</td><td class='sql-cell'><code>" + p.sql.replace(/</g, "&lt;") + "</code></td></tr>";
        }).join("") : '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--fg-muted)">未发现电气逻辑异常</td></tr>';

        $("#btn-csv").addEventListener("click", function () { compUI.exportCSV("电气逻辑问题.csv", compApi.STANDARD_HEADERS.problems, LAST.map(function (p) { return [p.seq, compApi.l1Name(p.l1), compApi.l2Name(p.l2), p.devId, p.devName, p.feeder, p.station, p.desc, p.fix, p.sql]; })); appShell.toast("已导出 CSV", "ok"); });
        $("#btn-xlsx").addEventListener("click", function () { compUI.exportXLSX("拓扑校验问题标准输出.xlsx", [{ name: "拓扑校验问题清单", headers: compApi.STANDARD_HEADERS.problems, rows: LAST.map(function (p) { return [p.seq, compApi.l1Name(p.l1), compApi.l2Name(p.l2), p.devId, p.devName, p.feeder, p.station, p.desc, p.fix, p.sql]; }) }]); appShell.toast("已导出标准 XLSX", "ok"); });
      });
    }, 50);
  </script>
<script src="../assets/xlsx.full.min.js"></script>
</body>
</html>
