<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" class="ic-svg">
  <title>PV Inverter (光伏逆变器)</title>
  <desc>分布式光伏 + 直流/交流逆变器, GB/T 35689 新能源符号</desc>
  <rect class="ic-bg" width="256" height="256"/>
  <g transform="translate(128,128)">
  <style>
    .ic-bg { fill: #ffffff; fill-opacity: 0.001; }
    .ic-line { fill: none; stroke: #111827; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .ic-fill { fill: #111827; }
    .ic-line-thin { fill: none; stroke: #111827; stroke-width: 3; stroke-linecap: round; }
    .ic-text { font-family: -apple-system, Segoe UI, Arial, sans-serif; font-size: 24px; font-weight: 600; fill: #111827; text-anchor: middle; }
  </style>

  <!-- 太阳 + 直流 -->
  <circle class="ic-line" cx="-30" cy="-22" r="34"/>
  <line class="ic-line" x1="-30" y1="-72" x2="-30" y2="-58"/>
  <line class="ic-line" x1="-30" y1="14" x2="-30" y2="32"/>
  <line class="ic-line" x1="-80" y1="-22" x2="-66" y2="-22"/>
  <line class="ic-line" x1="6" y1="-22" x2="20" y2="-22"/>
  <line class="ic-line" x1="-69" y1="-61" x2="-58" y2="-50"/>
  <line class="ic-line" x1="9" y1="7" x2="20" y2="18"/>
  <!-- 箭头指示 DC→AC 逆变 -->
  <rect class="ic-line" x="20" y="-50" width="100" height="60" rx="4"/>
  <text x="70" y="-12" class="ic-text" style="font-size:18px">DC→AC</text>
  <line class="ic-line" x1="120" y1="-20" x2="148" y2="-20"/>
  <line class="ic-line" x1="148" y1="-20" x2="140" y2="-28"/>
  <line class="ic-line" x1="148" y1="-20" x2="140" y2="-12"/>
</g>
</svg>
