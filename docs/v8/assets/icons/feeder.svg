<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" class="ic-svg">
  <title>Feeder Line (馈线)</title>
  <desc>国网馈线符号, 单线表示配电支路</desc>
  <rect class="ic-bg" width="256" height="256"/>
  <g transform="translate(128,128)">
  <style>
    .ic-bg { fill: #ffffff; fill-opacity: 0.001; }
    .ic-line { fill: none; stroke: #111827; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .ic-fill { fill: #111827; }
    .ic-line-thin { fill: none; stroke: #111827; stroke-width: 3; stroke-linecap: round; }
    .ic-text { font-family: -apple-system, Segoe UI, Arial, sans-serif; font-size: 24px; font-weight: 600; fill: #111827; text-anchor: middle; }
  </style>

  <!-- 国网: 单线 -->
  <line class="ic-line" x1="-110" y1="0" x2="110" y2="0"/>
  <circle class="ic-fill" cx="-110" cy="0" r="5"/>
  <circle class="ic-fill" cx="110" cy="0" r="5"/>
  <text x="0" y="40" class="ic-text" style="font-size:18px">L</text>
  <text x="0" y="62" class="ic-text" style="font-size:14px">馈线</text>
</g>
</svg>
