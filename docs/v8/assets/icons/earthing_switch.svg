<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" class="ic-svg">
  <title>Earthing Switch (接地刀闸 QE)</title>
  <desc>GB/T 35689 接地刀闸符号, 三道递减短线表示接地</desc>
  <rect class="ic-bg" width="256" height="256"/>
  <g transform="translate(128,128)">
  <style>
    .ic-bg { fill: #ffffff; fill-opacity: 0.001; }
    .ic-line { fill: none; stroke: #111827; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .ic-fill { fill: #111827; }
    .ic-line-thin { fill: none; stroke: #111827; stroke-width: 3; stroke-linecap: round; }
    .ic-text { font-family: -apple-system, Segoe UI, Arial, sans-serif; font-size: 24px; font-weight: 600; fill: #111827; text-anchor: middle; }
  </style>

  <!-- QS + 接地符号 -->
  <line class="ic-line" x1="-100" y1="-20" x2="-72" y2="-20"/>
  <line class="ic-line" x1="72" y1="-20" x2="100" y2="-20"/>
  <line class="ic-line" x1="-72" y1="-22" x2="80" y2="-70"/>
  <circle class="ic-fill" cx="-72" cy="-20" r="5"/>
  <circle class="ic-fill" cx="72" cy="-20" r="5"/>
  <line class="ic-line" x1="-30" y1="20" x2="80" y2="20"/>
  <line class="ic-line" x1="-10" y1="40" x2="40" y2="40"/>
  <line class="ic-line" x1="0" y1="60" x2="40" y2="60"/>
  <line class="ic-line" x1="20" y1="80" x2="40" y2="80"/>
  <text x="0" y="110" class="ic-text" style="font-size:18px">QE</text>
</g>
</svg>
