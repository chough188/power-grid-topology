<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拓扑可视化 | PowerGrid AI v8</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <script src="../assets/d3.v7.min.js"></script>
  <script src="../assets/config.js"></script>
  <script src="../assets/api.js"></script>
  <script src="../assets/shell.js"></script>
  <style>
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .topo-wrap { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; height: 620px; position: relative; overflow: hidden; }
    .topo-legend { position: absolute; top: 16px; right: 16px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: 11px; box-shadow: var(--shadow-sm); }
    .topo-legend div { display: flex; align-items: center; gap: 6px; margin: 3px 0; color: var(--fg-muted); }
    .topo-legend div span.dot { width: 10px; height: 10px; border-radius: 50%; }
    .topo-info { position: absolute; top: 16px; left: 16px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: 11px; box-shadow: var(--shadow-sm); }
    .topo-info strong { color: var(--fg); }
    svg.topo { width: 100%; height: 100%; cursor: grab; }
    svg.topo:active { cursor: grabbing; }
    .node { cursor: pointer; }
    .node circle { stroke: var(--bg-elev); stroke-width: 2px; transition: all .2s; }
    .node text { font-size: 9px; fill: var(--fg-muted); pointer-events: none; }
    .link { stroke-opacity: .5; transition: stroke-opacity .2s; }
    .link.highlight { stroke-opacity: 1; stroke: var(--err); stroke-width: 2.5px; }

    /* ===== 选中节点信息侧栏 (Inspector) ===== */
    .topo-detail {
      position: absolute; right: 16px; bottom: 16px; width: 264px;
      max-height: calc(100% - 32px);
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: 10px; box-shadow: var(--shadow-lg);
      display: flex; flex-direction: column; overflow: hidden;
      transform: translateY(10px); opacity: 0; pointer-events: none;
      transition: transform var(--tr), opacity var(--tr);
      z-index: 20;
    }
    .topo-detail.open { transform: none; opacity: 1; pointer-events: auto; }
    .topo-detail-head {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-bottom: 1px solid var(--border);
    }
    .topo-detail-head .td-title {
      flex: 1; display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; color: var(--fg);
    }
    .td-close {
      background: transparent; border: none; color: var(--fg-muted);
      cursor: pointer; padding: 4px; border-radius: 6px; display: inline-flex;
    }
    .td-close:hover { background: var(--bg-elev-2); color: var(--fg); }
    .td-copy { background: transparent; border: none; color: var(--fg-muted); cursor: pointer; padding: 4px; border-radius: 6px; display: inline-flex; }
    .td-copy:hover { background: var(--bg-elev-2); color: var(--fg); }
    .topo-detail-body { padding: 12px; overflow-y: auto; font-size: 12px; }
    .td-section {
      margin: 10px 0 4px; font-size: 10px; font-weight: 700; letter-spacing: .5px;
      text-transform: uppercase; color: var(--fg-dim);
    }
    .td-row {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 5px 0; border-bottom: 1px dashed var(--border);
    }
    .td-row:last-child { border-bottom: none; }
    .td-key { color: var(--fg-muted); flex: 0 0 auto; }
    .td-val { color: var(--fg); font-weight: 600; text-align: right; word-break: break-all; }
    .td-empty { color: var(--fg-dim); font-size: 12px; padding: 6px 0; }
    .node.selected circle { stroke: var(--accent); stroke-width: 3px; }
    .node.dimmed { opacity: .28; }
    .link.connected { stroke: var(--accent) !important; stroke-opacity: 1 !important; stroke-width: 2px; }
    .node:focus-visible { outline: none; }
    .node:focus-visible circle { stroke: var(--accent); stroke-width: 3px; }
  </style>
</head>
<body>
  <div id="page-content">
    <div class="toolbar">
      <select class="select" id="network-select" style="width:200px"></select>
      <button class="btn btn-primary" id="btn-load">加载拓扑</button>
      <button class="btn" id="btn-highlights"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg> 高亮异常</button>
      <button class="btn" id="btn-zoom-in"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
      <button class="btn" id="btn-zoom-out"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
      <button class="btn" id="btn-reset"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 18 10"/><polyline points="1 20 1 14 6 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> 重置</button>
      <span style="flex:1"></span>
      <span class="badge" id="badge-count">节点/线路 —</span>
    </div>
    <div class="topo-wrap" id="topo-wrap">
      <div class="topo-info" id="topo-info">网络: <strong>—</strong> · 异常高亮: <strong id="hl-count">0</strong></div>
      <div class="topo-legend">
        <div><span class="dot" style="background:var(--accent)"></span>母线 (bus)</div>
        <div><span class="dot" style="background:var(--success)"></span>发电机</div>
        <div><span class="dot" style="background:var(--err)"></span>异常</div>
        <div>── 线路 (line)</div>
      </div>
      <svg class="topo" id="topo-svg"></svg>
      <div class="topo-detail" id="topo-detail" role="region" aria-label="节点详情" aria-hidden="true">
        <div class="topo-detail-head">
          <span class="td-title">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
            <span id="td-name">节点详情</span>
          </span>
          <button class="td-copy" id="td-copy" type="button" aria-label="复制节点 ID" title="复制节点 ID">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="td-close" id="td-close" type="button" aria-label="关闭节点详情">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="topo-detail-body" id="td-body"></div>
      </div>
    </div>
  </div>

  <script>
    appShell.renderShell({
      page: "topology",
      title: "拓扑可视化",
      breadcrumb: "v8 / topology",
      body: document.getElementById("page-content").innerHTML,
    });
    // 重新绑定工具栏 (因为 shell 重新渲染了 DOM)
    var $ = function (s) { return document.querySelector(s); };
    var svgEl = document.getElementById("topo-svg");
    var gZoom, gLink, gNode;
    var simulation;
    var NODE_DATA = [];
    var LINK_DATA = [];
    var SELECTED_KEY = null;
    var NAV_SEQ = [];      // 当前导航序列: [中心节点, ...邻居]
    var NAV_IDX = -1;      // 序列中当前所处索引
    var GROUP_ORDER = [];  // 节点按层级/类型聚合后的分组顺序
    var GROUP_IDX = -1;    // 当前所在分组索引

    function initSvg() {
      var wrap = document.getElementById("topo-wrap");
      var rect = wrap.getBoundingClientRect();
      svgEl.setAttribute("viewBox", "0 0 " + rect.width + " " + rect.height);
      svgEl.innerHTML = "";
      gZoom = d3.select(svgEl).append("g").attr("class", "zoom-root");
      gLink = gZoom.append("g").attr("class", "links");
      gNode = gZoom.append("g").attr("class", "nodes");
      var zoom = d3.zoom().scaleExtent([0.3, 4]).on("zoom", function (event) {
        gZoom.attr("transform", event.transform);
      });
      d3.select(svgEl).call(zoom);
    }

    async function loadNetworks() {
      try {
        var r = await api.networks();
        var sel = $("#network-select");
        sel.innerHTML = "";
        var list = (r.data && Array.isArray(r.data)) ? r.data : (r.data && r.data.networks) || [];
        sel.innerHTML = (list.length ? list : ["case33bw", "case14", "case57"]).map(function (n) {
          var v = typeof n === "string" ? n : (n.name || "case33bw");
          return "<option value=\"" + v + "\"" + (v === CONFIG.DEFAULT_NETWORK ? " selected" : "") + ">" + v + "</option>";
        }).join("");
      } catch (e) {
        $("#network-select").innerHTML = "<option value=\"case33bw\">case33bw</option>";
      }
    }

    async function loadTopology() {
      initSvg();
      var name = $("#network-select").value || CONFIG.DEFAULT_NETWORK;
      appShell.showLoading(true, "加载拓扑 " + name);
      try {
        var r = await api.topology(name);
        if (!r.ok) throw new Error("HTTP " + r.status);
        var d = r.data || {};
        var nodes = (d.nodes || d.buses || []).map(function (n) {
          return Object.assign({}, n, { x: Math.random() * 800, y: Math.random() * 600 });
        });
        var links = (d.links || d.lines || []).map(function (l) {
          return { source: typeof l.source === "object" ? l.source.id || l.source.name : l.source,
                   target: typeof l.target === "object" ? l.target.id || l.target.name : l.target,
                   value: l.value || 1 };
        });
        $("#badge-count").textContent = "节点:" + nodes.length + " 线路:" + links.length;
        document.getElementById("topo-info").innerHTML = "网络: <strong>" + name + "</strong> · 异常高亮: <strong id=\"hl-count\">0</strong>";
        renderGraph(nodes, links);
      } catch (e) {
        appShell.toast("拓扑加载失败: " + e.message, "err");
        document.getElementById("topo-info").innerHTML = "<span style=\"color:var(--fg-err)\">" + e.message + "</span>";
      } finally {
        appShell.showLoading(false);
      }
    }

    function renderGraph(nodes, links) {
      NODE_DATA = nodes;
      LINK_DATA = links;
      buildGroups();
      SELECTED_KEY = null;
      closeDetail();
      var rect = document.getElementById("topo-wrap").getBoundingClientRect();
      var W = rect.width, H = rect.height;
      simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(function (d) { return d.id || d.name || d; }).distance(60))
        .force("charge", d3.forceManyBody().strength(-160))
        .force("center", d3.forceCenter(W / 2, H / 2))
        .force("collide", d3.forceCollide(10));

      var link = gLink.selectAll("line").data(links).join("line")
        .attr("class", "link")
        .attr("stroke", appShell.cssVar("--fg-dim"))
        .attr("stroke-width", 1.2);
      var node = gNode.selectAll("g").data(nodes).join("g").attr("class", "node")
        .attr("tabindex", 0)
        .attr("role", "button")
        .attr("aria-label", function (d) { return "节点 " + (d.id || d.name || ""); })
        .on("keydown", function (event, d) {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectNode(d); }
        });
      node.append("circle").attr("r", 6).attr("fill", appShell.cssVar("--accent"));
      node.append("text").attr("x", 9).attr("y", 3).text(function (d) { return (d.id || d.name || "").toString(); });
      node.call(d3.drag().on("start", dragStart).on("drag", dragging).on("end", dragEnd));

      simulation.on("tick", function () {
        link.attr("x1", function (d) { return d.source.x; }).attr("y1", function (d) { return d.source.y; })
            .attr("x2", function (d) { return d.target.x; }).attr("y2", function (d) { return d.target.y; });
        node.attr("transform", function (d) { return "translate(" + d.x + "," + d.y + ")"; });
      });

      function dragStart(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
        d.__px0 = event.x; d.__py0 = event.y; d.__moved = false;
      }
      function dragging(event, d) {
        d.fx = event.x; d.fy = event.y;
        if (Math.hypot(event.x - d.__px0, event.y - d.__py0) > 3) d.__moved = true;
      }
      function dragEnd(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
        if (!d.__moved) selectNode(d);   // 视为点击而非拖拽
      }
    }

    function inferType(key) {
      if (/bus/i.test(key)) return "母线 (bus)";
      if (/gen|generator|发电机/i.test(key)) return "发电机 (generator)";
      if (/line|branch|线路/i.test(key)) return "线路 (line)";
      if (/trafo|transformer|变压器/i.test(key)) return "变压器 (transformer)";
      return "设备 (device)";
    }

    // 统一取节点标识 (兼容 d3.forceLink 把 source/target 解析为对象的情况)
    function nodeKey(n) { return (n && (n.id || n.name)) || n; }

    // 取与某节点直接相连的邻居节点数组 (去重)
    function neighborsOf(key) {
      var res = [], seen = {};
      LINK_DATA.forEach(function (l) {
        var sk = nodeKey(l.source), tk = nodeKey(l.target);
        var other = null;
        if (sk === key) other = l.target;
        else if (tk === key) other = l.source;
        if (other) {
          var ok = nodeKey(other);
          if (ok && !seen[ok]) { seen[ok] = true; res.push(other); }
        }
      });
      return res;
    }

    // 节点分组 (按层级/layer, 无则按推断类型), 用于 ↑ / ↓ 跨组跳转
    function nodeGroup(d) {
      if (d && d.layer) return d.layer;
      return inferType(d.id || d.name || "").split(" ")[0];
    }
    function buildGroups() {
      var seen = {};
      GROUP_ORDER = [];
      NODE_DATA.forEach(function (n) {
        var g = nodeGroup(n);
        n.__group = g;
        if (!seen[g]) { seen[g] = true; GROUP_ORDER.push(g); }
      });
      // 排序: 带 L 数字层级按数字, 否则按电力拓扑常见层级
      var preferred = ["母线", "发电机", "变压器", "设备", "线路"];
      GROUP_ORDER.sort(function (a, b) {
        var ma = /^L(\d+)$/.exec(a), mb = /^L(\d+)$/.exec(b);
        if (ma && mb) return (+ma[1]) - (+mb[1]);
        if (ma && !mb) return -1;
        if (!ma && mb) return 1;
        var ia = preferred.indexOf(a), ib = preferred.indexOf(b);
        return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
      });
    }
    function firstNodeOfGroup(g) {
      for (var i = 0; i < NODE_DATA.length; i++) { if (NODE_DATA[i].__group === g) return NODE_DATA[i]; }
      return null;
    }
    // 在分组序列中按方向跳转, 选中该组首个节点 (键盘 ↑ / ↓)
    function navigateGroup(dir) {
      if (GROUP_ORDER.length < 2) return;
      var next = (GROUP_IDX + dir + GROUP_ORDER.length) % GROUP_ORDER.length;
      GROUP_IDX = next;
      var g = GROUP_ORDER[next];
      var node = firstNodeOfGroup(g);
      if (!node) return;
      selectNode(node, true);
      var el = gNode.selectAll("g.node").filter(function (n) { return (n.id || n.name) === (node.id || node.name); }).node();
      if (el && el.focus) el.focus();
    }

    // 在导航序列中按方向切换节点 (键盘 ← / →)
    function navigate(dir) {
      if (NAV_SEQ.length < 2) return;
      var next = (NAV_IDX + dir + NAV_SEQ.length) % NAV_SEQ.length;
      NAV_IDX = next;
      var node = NAV_SEQ[next];
      selectNode(node, false);
      GROUP_IDX = GROUP_ORDER.indexOf(nodeGroup(node));
      // 焦点移回对应节点, 让焦点环可见并跟随屏幕阅读器
      var el = gNode.selectAll("g.node").filter(function (n) { return (n.id || n.name) === (node.id || node.name); }).node();
      if (el && el.focus) el.focus();
    }

    function selectNode(d, rebuild) {
      var key = d.id || d.name || "";
      SELECTED_KEY = key;
      // 仅在用户点击/选中节点时重建导航序列; 键盘切换时复用序列
      if (rebuild !== false) {
        NAV_SEQ = [d].concat(neighborsOf(key));
        NAV_IDX = 0;
        GROUP_IDX = GROUP_ORDER.indexOf(nodeGroup(d));
      }
      var netName = $("#network-select").value || CONFIG.DEFAULT_NETWORK;

      // 高亮选中节点 + 淡化其余
      gNode.selectAll("g.node")
        .classed("selected", function (n) { return (n.id || n.name) === key; })
        .classed("dimmed", function (n) { return (n.id || n.name) !== key; });
      // 高亮相连线路
      gLink.selectAll("line").classed("connected", function (l) {
        var s = nodeKey(l.source), t = nodeKey(l.target);
        return s === key || t === key;
      });

      // 度数
      var deg = 0;
      LINK_DATA.forEach(function (l) {
        var s = nodeKey(l.source), t = nodeKey(l.target);
        if (s === key || t === key) deg++;
      });

      // 是否异常节点 (与高亮集合比对)
      var isAnomaly = gNode.selectAll("circle").filter(function (n) {
        return (n.id || n.name) === key;
      }).node().getAttribute("fill") === appShell.cssVar("--err");

      // 组装面板内容
      var rows = "";
      rows += row("网络", netName);
      rows += row("标识", key);
      rows += row("类型", inferType(key));
      rows += row("连接度数", deg);
      rows += row("状态", isAnomaly
        ? "<span class=\"badge badge-err\">异常</span>"
        : "<span class=\"badge badge-ok\">正常</span>");

      // 其余属性 (排除已展示字段)
      var skip = { id: 1, name: 1, x: 1, y: 1, vx: 1, vy: 1, fx: 1, fy: 1, index: 1, __moved: 1, __px0: 1, __py0: 1 };
      var extra = Object.keys(d).filter(function (k) { return !skip[k]; });
      var extraHtml = "";
      if (extra.length) {
        extraHtml += "<div class=\"td-section\">属性</div>";
        extra.forEach(function (k) {
          var v = d[k];
          if (v && typeof v === "object") v = JSON.stringify(v);
          extraHtml += row(k, String(v));
        });
      } else {
        extraHtml = "<div class=\"td-empty\">无更多属性</div>";
      }

      // 键盘导航提示
      var navHint = "";
      if (NAV_SEQ.length > 1 || GROUP_ORDER.length > 1) {
        navHint = "<div class=\"td-section\">键盘导航</div>";
        if (NAV_SEQ.length > 1) {
          navHint += "<div class=\"td-row\"><span class=\"td-key\">相邻节点</span><span class=\"td-val\">" + (NAV_SEQ.length - 1) + " 个</span></div>" +
            "<div class=\"td-empty\">按 ← / → 在相邻节点间切换</div>";
        }
        if (GROUP_ORDER.length > 1) {
          navHint += "<div class=\"td-row\"><span class=\"td-key\">节点分组</span><span class=\"td-val\">" + (GROUP_IDX + 1) + " / " + GROUP_ORDER.length + " · " + nodeGroup(d) + "</span></div>" +
            "<div class=\"td-empty\">按 ↑ / ↓ 在分组间跳转</div>";
        }
      }

      $("#td-name").textContent = key || "节点";
      $("#td-body").innerHTML = rows + extraHtml + navHint;
      var panel = document.getElementById("topo-detail");
      panel.classList.add("open");
      panel.setAttribute("aria-hidden", "false");
    }

    function row(k, v) {
      return "<div class=\"td-row\"><span class=\"td-key\">" + k + "</span><span class=\"td-val\">" + v + "</span></div>";
    }

    function copyNodeId() {
      var key = SELECTED_KEY;
      if (!key) return;
      var done = function () { appShell.toast("已复制节点 ID: " + key, "ok"); };
      var fail = function () {
        try {
          var ta = document.createElement("textarea");
          ta.value = String(key); ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
          done();
        } catch (e) { appShell.toast("复制失败", "err"); }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(String(key)).then(done, fail);
      } else { fail(); }
    }

    function closeDetail() {
      SELECTED_KEY = null;
      NAV_SEQ = [];
      NAV_IDX = -1;
      GROUP_ORDER = [];
      GROUP_IDX = -1;
      gNode.selectAll("g.node").classed("selected", false).classed("dimmed", false);
      gLink.selectAll("line").classed("connected", false);
      var panel = document.getElementById("topo-detail");
      if (panel) { panel.classList.remove("open"); panel.setAttribute("aria-hidden", "true"); }
    }

    async function loadHighlights() {
      var name = $("#network-select").value || CONFIG.DEFAULT_NETWORK;
      appShell.showLoading(true, "加载异常高亮");
      try {
        var r = await api.topologyHighlights(name);
        if (!r.ok) throw new Error("HTTP " + r.status);
        var hl = r.data || {};
        var highlights = hl.highlights || [];
        // 重置所有 link 为默认色
        gLink.selectAll("line").classed("highlight", false);
        gNode.selectAll("circle").attr("fill", appShell.cssVar("--accent"));
        var busSet = {};
        highlights.forEach(function (h) {
          var m = (h.target || "").match(/bus[_\s-]*(\d+)/i);
          if (m) busSet[parseInt(m[1], 10)] = true;
          m = (h.target || "").match(/line[_\s-]*(\d+)/i);
          if (m) busSet["L" + parseInt(m[1], 10)] = true;
        });
        var count = 0;
        gNode.selectAll("circle").each(function (d) {
          var key = d.id || d.name;
          if (busSet[key] || busSet["L" + key]) {
            d3.select(this).attr("fill", appShell.cssVar("--err")).attr("r", 9);
            count++;
          }
        });
        document.getElementById("hl-count").textContent = count;
        appShell.toast("已高亮 " + count + " 个异常节点 (" + highlights.length + " 条记录)", "ok");
      } catch (e) {
        appShell.toast("加载异常高亮失败: " + e.message, "err");
      } finally {
        appShell.showLoading(false);
      }
    }

    // 事件绑定 (等 shell 渲染完后)
    setTimeout(function () {
      loadNetworks().then(function () {
        loadTopology();
      });
      document.getElementById("btn-load").addEventListener("click", loadTopology);
      document.getElementById("btn-highlights").addEventListener("click", loadHighlights);
      document.getElementById("btn-zoom-in").addEventListener("click", function () {
        d3.select(svgEl).transition().call(d3.zoom().scaleBy, 1.3);
      });
      document.getElementById("btn-zoom-out").addEventListener("click", function () {
        d3.select(svgEl).transition().call(d3.zoom().scaleBy, 0.7);
      });
      document.getElementById("btn-reset").addEventListener("click", function () { loadTopology(); });

      // 关闭节点详情
      document.getElementById("td-close").addEventListener("click", closeDetail);
      document.getElementById("td-copy").addEventListener("click", copyNodeId);
      // 点击空白画布关闭 (仅当点击的是 svg 背景而非节点)
      svgEl.addEventListener("click", function (e) {
        if (e.target && e.target.tagName === "svg") closeDetail();
      });

      // 节点详情打开时: ← / → 切换相邻节点, ↑ / ↓ 跨分组跳转 (输入框/下拉聚焦时不拦截)
      document.addEventListener("keydown", function (e) {
        if (!SELECTED_KEY) return;
        var t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
        if (e.key === "ArrowRight") { e.preventDefault(); navigate(1); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); navigate(-1); }
        else if (e.key === "ArrowDown") { if (GROUP_ORDER.length > 1) { e.preventDefault(); navigateGroup(1); } }
        else if (e.key === "ArrowUp") { if (GROUP_ORDER.length > 1) { e.preventDefault(); navigateGroup(-1); } }
      });

      // 窗口/侧栏尺寸变化时: 更新 viewBox 并按新容器尺寸重置力导向中心, 保持图形居中
      appShell.addResizeHandler(function () {
        var wrap = document.getElementById("topo-wrap");
        if (!wrap || !simulation) return;
        var rect = wrap.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        svgEl.setAttribute("viewBox", "0 0 " + rect.width + " " + rect.height);
        simulation.force("center", d3.forceCenter(rect.width / 2, rect.height / 2));
        simulation.alpha(0.35).restart();
      });
    }, 50);
  </script>
</body>
</html>
