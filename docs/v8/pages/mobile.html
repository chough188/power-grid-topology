<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>现场作业 | PowerGrid AI v8</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <script src="../assets/config.js"></script>
  <script src="../assets/api.js"></script>
  <script src="../assets/shell.js"></script>
  <style>
    .mobile-shell { max-width: 480px; margin: 0 auto; }
    .loc-block { padding: var(--sp-3); background: var(--bg-elev-2); border-radius: var(--radius-sm); margin: var(--sp-3) 0; font-size: var(--fs-base); font-family: var(--font-mono); }
    .loc-block span.mono { color: var(--accent); font-weight: 600; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); margin: var(--sp-4) 0; }
    .action-grid .btn { padding: 14px; font-size: var(--fs-base); font-weight: 600; }
  </style>
</head>
<body>
  <div id="page-content">
    <div class="mobile-shell">
      <div class="card">
        <strong style="display:block;margin-bottom:10px"><span class="sec-ico"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></span>当前工单</strong>
        <div id="current-wo" style="font-family:var(--font-mono);font-size:12px;color:var(--fg-muted)">加载中...</div>
      </div>
      <div class="card" style="margin-top:12px">
        <strong style="display:block;margin-bottom:10px"><span class="sec-ico"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>定位信息</strong>
        <div class="loc-block">
          纬度: <span class="mono" id="lat">—</span><br>
          经度: <span class="mono" id="lng">—</span><br>
          精度: <span class="mono" id="acc">—</span> m
        </div>
        <a id="map-link" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-primary" style="margin-top:8px"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> 在地图中打开</a>
      </div>
      <div class="card" style="margin-top:12px">
        <strong style="display:block;margin-bottom:10px"><span class="sec-ico"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>工单操作</strong>
        <div class="action-grid">
          <button class="btn" id="btn-arrive"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> 到达</button>
          <button class="btn" id="btn-photo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> 拍照</button>
          <button class="btn btn-success" id="btn-resolve"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> 完成</button>
          <button class="btn btn-danger" id="btn-escalate"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> 升级</button>
        </div>
      </div>
      <div class="card" style="margin-top:12px">
        <strong style="display:block;margin-bottom:10px"><span class="sec-ico"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg></span>离线缓存</strong>
        <div style="font-size:11px;color:var(--fg-muted);margin-bottom:8px">同步状态: <span id="offline-stat">正常</span></div>
        <button class="btn btn-block" id="btn-sync"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 18 10"/><polyline points="1 20 1 14 6 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> 立即同步</button>
      </div>
    </div>
  </div>

  <script>
    appShell.renderShell({ page: "mobile", title: "现场作业", breadcrumb: "v8 / mobile / field-ops", body: document.getElementById("page-content").innerHTML });
    var $ = function (s) { return document.querySelector(s); };

    setTimeout(function () {
      loadCurrent();
      initGeolocation();
      document.getElementById("btn-arrive").addEventListener("click", function () { appShell.toast("已记录到场", "ok"); });
      document.getElementById("btn-photo").addEventListener("click", function () { appShell.toast("照片上传 (模拟)", "ok"); });
      document.getElementById("btn-resolve").addEventListener("click", function () { appShell.toast("工单已完成", "ok"); });
      document.getElementById("btn-escalate").addEventListener("click", function () { appShell.toast("已升级工单", "warn"); });
      document.getElementById("btn-sync").addEventListener("click", syncOffline);
      // 离线降级: 未获定位拦截; 离线时阻止跳转并复制坐标到剪贴板 (纯 UX, 不影响比赛内容)
      document.getElementById("map-link").addEventListener("click", function (e) {
        if (this.getAttribute("href") === "#" || !this.dataset.lat) {
          e.preventDefault(); appShell.toast("尚未获取定位坐标, 无法打开地图", "warn"); return;
        }
        if (!navigator.onLine) {
          e.preventDefault();
          var txt = "纬度 " + this.dataset.lat + ", 经度 " + this.dataset.lng;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).catch(function () {});
          }
          appShell.toast("当前离线: 坐标已复制到剪贴板 (" + txt + ")", "warn");
        }
      });
    }, 50);

    async function loadCurrent() {
      try {
        var r = await api.apiFetch("/api/v1/workorders/wo_demo_001/mobile");
        if (r.ok && r.data) {
          $("#current-wo").innerHTML = "<pre style=\"font-family:var(--font-mono);font-size:11px;color:var(--fg);background:var(--bg-elev-2);padding:8px;border-radius:6px;overflow:auto\">" + JSON.stringify(r.data, null, 2) + "</pre>";
        } else {
          $("#current-wo").textContent = "暂无工单 (wo_demo_001 不存在)";
        }
      } catch (e) {
        $("#current-wo").textContent = "后端离线,显示演示数据";
      }
    }

    function initGeolocation() {
      if (!("geolocation" in navigator)) {
        $("#lat").textContent = $("#lng").textContent = "浏览器不支持";
        return;
      }
      navigator.geolocation.getCurrentPosition(function (pos) {
        $("#lat").textContent = pos.coords.latitude.toFixed(6);
        $("#lng").textContent = pos.coords.longitude.toFixed(6);
        $("#acc").textContent = pos.coords.accuracy.toFixed(0);
        var link = $("#map-link");
        var lat = pos.coords.latitude, lng = pos.coords.longitude;
        link.dataset.lat = lat; link.dataset.lng = lng;
        link.href = "https://www.openstreetmap.org/?mlat=" + lat + "&mlon=" + lng + "#map=18/" + lat + "/" + lng;
      }, function () {
        $("#lat").textContent = $("#lng").textContent = "权限被拒";
      });
    }

    async function syncOffline() {
      appShell.toast("同步中...", "info");
      try {
        var r = await api.apiFetch("/api/v1/offline/sync", { method: "POST", body: {} });
        appShell.toast(r.ok ? "同步成功" : "同步失败 HTTP " + r.status, r.ok ? "ok" : "err");
      } catch (e) {
        appShell.toast("同步失败: " + e.message, "err");
      }
    }
  </script>
</body>
</html>
